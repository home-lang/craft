name: Native tab swipe verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-navigation:
    name: UIKit and stx navigation
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Checkout stx compiler
        uses: actions/checkout@v6
        with:
          repository: stacksjs/stx
          ref: 1bb9d581d88517778b10333f57c2be41bae9fd0e
          path: .stx-compiler
      - name: Install stx compiler dependencies
        working-directory: .stx-compiler
        run: bun install --no-save
      - name: Test native gesture geometry and simulator touches
        env:
          STX_CLI: ${{ github.workspace }}/.stx-compiler/packages/stx/bin/cli.ts
          CRAFT_KEEP_NATIVE_NAVIGATION_PROJECT: '1'
          TMPDIR: ${{ runner.temp }}
        run: |
          bun packages/ios/scripts/test-native-navigation.ts --prepare-only
          navigation_simulator=$(bun -e 'import { pickSimulator, bootSimulator } from "./packages/ios/src/index.ts"; const device = await pickSimulator(); if (!device) throw new Error("No simulator available"); await bootSimulator(device); console.log(device.udid)')
          navigation_workspaces=("$RUNNER_TEMP"/craft-native-navigation-*)
          cd "${navigation_workspaces[0]}/NativeNavigation"
          xcodebuild -quiet -project NativeNavigation.xcodeproj -scheme NativeNavigation \
            -configuration Debug -destination "id=$navigation_simulator" \
            -derivedDataPath ../DerivedData -resultBundlePath ../NativeNavigation.xcresult \
            -only-testing:NativeNavigationUnitTests \
            -only-testing:NativeNavigationUITests/NativeNavigationUITests/testTabSwipeSwitchesNativeRootsAndReturns \
            -only-testing:NativeNavigationUITests/NativeNavigationUITests/testSwipesAcrossAllFiveNativeTabsAndBack \
            -only-testing:NativeNavigationUITests/NativeNavigationUITests/testShortTabSwipeCancelsAndTheNextSwipeStillWorks \
            -only-testing:NativeNavigationUITests/NativeNavigationUITests/testHorizontalCarouselKeepsItsSwipe \
            -parallel-testing-enabled NO CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO ENABLE_TESTABILITY=YES test
      - name: Upload native transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-tab-transitions
          path: ${{ runner.temp }}/craft-native-navigation-*/NativeNavigation.xcresult
          if-no-files-found: warn

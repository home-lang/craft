name: Native navigation acceptance verification

on:
  workflow_dispatch:
    inputs:
      verify_baseline:
        description: Reproduce the regression against v0.0.200 first
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-navigation:
    name: UIKit and stx navigation
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Checkout stx compiler
        uses: actions/checkout@v6
        with:
          repository: stacksjs/stx
          ref: 3dd3240fc9a64f360e9690eee50c483be3325705
          path: .stx-compiler
      - name: Install stx compiler dependencies
        working-directory: .stx-compiler
        run: bun install --no-save
      - name: Verify the previous release loses a newer tab tap
        if: ${{ inputs.verify_baseline }}
        env:
          STX_CLI: ${{ github.workspace }}/.stx-compiler/packages/stx/bin/cli.ts
          CRAFT_KEEP_NATIVE_NAVIGATION_PROJECT: '1'
          CRAFT_ONLY_TESTING: NativeNavigationUnitTests/NativeNavigationUnitTests/testTabTapDuringSettlingWinsOverTheSwipeCompletion
          TMPDIR: ${{ runner.temp }}
        run: |
          git fetch --depth 1 origin tag v0.0.200
          git show v0.0.200:packages/ios/templates/CraftHybrid.swift > packages/ios/templates/CraftHybrid.swift
          git show v0.0.200:packages/ios/templates/CraftApp.swift > packages/ios/templates/CraftApp.swift
          set +e
          bun packages/ios/scripts/test-native-navigation.ts > "$RUNNER_TEMP/native-interruption-before.log" 2>&1
          navigation_baseline_status=$?
          set -e
          git restore -- packages/ios/templates/CraftHybrid.swift packages/ios/templates/CraftApp.swift
          cat "$RUNNER_TEMP/native-interruption-before.log"
          test "$navigation_baseline_status" -ne 0
          bun -e 'const log = await Bun.file(process.env.RUNNER_TEMP + "/native-interruption-before.log").text(); if (!log.includes("a completed swipe overrode the newer tab tap")) throw new Error("The baseline did not reproduce the expected selection failure")'
          navigation_workspaces=("$RUNNER_TEMP"/craft-native-navigation-*)
          mv "${navigation_workspaces[0]}/NativeNavigation.xcresult" "$RUNNER_TEMP/TabInterruptionBefore.xcresult"
      - name: Test native gesture geometry and simulator touches
        env:
          STX_CLI: ${{ github.workspace }}/.stx-compiler/packages/stx/bin/cli.ts
          CRAFT_KEEP_NATIVE_NAVIGATION_PROJECT: '1'
          CRAFT_ONLY_TESTING: NativeNavigationUnitTests,NativeNavigationUITests/NativeNavigationUITests/testTabSwipeSwitchesNativeRootsAndReturns,NativeNavigationUITests/NativeNavigationUITests/testSwipesAcrossAllFiveNativeTabsAndBack,NativeNavigationUITests/NativeNavigationUITests/testShortTabSwipeCancelsAndTheNextSwipeStillWorks,NativeNavigationUITests/NativeNavigationUITests/testHorizontalCarouselKeepsItsSwipe,NativeNavigationUITests/NativeNavigationUITests/testNativeLinkOpensRoute,NativeNavigationUITests/NativeNavigationUITests/testNativeBackSwipeKeepsTheSelectedTabAndHomeState
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          bun packages/ios/scripts/test-native-navigation.ts 2>&1 | tee "$RUNNER_TEMP/native-transition-after.log"
          navigation_results=("$RUNNER_TEMP"/craft-native-navigation-*/NativeNavigation.xcresult)
          xcrun xcresulttool get test-results summary --path "${navigation_results[0]}" > "$RUNNER_TEMP/native-transition-summary.json"
          bun -e 'const s = await Bun.file(process.env.RUNNER_TEMP + "/native-transition-summary.json").json(); if (s.result !== "Passed" || s.passedTests !== 13 || s.failedTests !== 0 || s.skippedTests !== 0) throw new Error(JSON.stringify(s)); console.log("Verified 13 passed, 0 failed, 0 skipped in the XCTest result bundle")'
      - name: Upload native transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-tab-transitions
          path: |
            ${{ runner.temp }}/craft-native-navigation-*/NativeNavigation.xcresult
            ${{ runner.temp }}/TabInterruptionBefore.xcresult
            ${{ runner.temp }}/native-interruption-before.log
            ${{ runner.temp }}/native-transition-after.log
            ${{ runner.temp }}/native-transition-summary.json
          if-no-files-found: warn

name: Native tab swipe verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-navigation:
    name: UIKit and stx navigation
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@e0e7377f6f94f1348b8efcfd3e631967261c6dce
        with:
          version: '0.11.64'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Checkout stx compiler
        uses: actions/checkout@v6
        with:
          repository: stacksjs/stx
          ref: 1bb9d581d88517778b10333f57c2be41bae9fd0e
          path: .stx-compiler
      - name: Install stx compiler dependencies
        working-directory: .stx-compiler
        run: bun install --no-save
      - name: Test native gesture geometry and simulator touches
        env:
          STX_CLI: ${{ github.workspace }}/.stx-compiler/packages/stx/bin/cli.ts
          CRAFT_KEEP_NATIVE_NAVIGATION_PROJECT: '1'
          TMPDIR: ${{ runner.temp }}
        run: bun packages/ios/scripts/test-native-navigation.ts
      - name: Upload native transition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-tab-transitions
          path: ${{ runner.temp }}/craft-native-navigation-*/NativeNavigation.xcresult
          if-no-files-found: warn

# Branch-only focused acceptance; restore normal CI before merging main.
name: CI
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, ios, android, sdk]
        default: all
permissions:
  contents: read
jobs:
  native-media-cache:
    uses: ./.github/workflows/media-cache.yml
    with:
      platform: ${{ inputs.platform }}
